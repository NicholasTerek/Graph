services:
  falkordb:
    image: falkordb/falkordb:v4.18.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - graph-data:/data
    environment:
      REDIS_ARGS: "--appendonly yes"
      FALKORDB_DATA_PATH: /data
      BROWSER: "0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      GRAPH_NAME: graph
      GRAPH_API_TOKENS: ${GRAPH_API_TOKENS:-[]}
      GRAPH_SOURCE_CONNECTIONS: ${GRAPH_SOURCE_CONNECTIONS:-}
      GRAPH_ALLOWED_HOSTS: ${GRAPH_ALLOWED_HOSTS:-}
      GRAPH_ALLOWED_ORIGINS: ${GRAPH_ALLOWED_ORIGINS:-}
      GRAPH_ACTION_REPOSITORY: ${GRAPH_ACTION_REPOSITORY:-NicholasTerek/Graph}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GRAPH_AGENT_BASE_URL: ${GRAPH_AGENT_BASE_URL:-}
      GRAPH_AGENT_MODEL: ${GRAPH_AGENT_MODEL:-}
      GRAPH_AGENT_API_KEY: ${GRAPH_AGENT_API_KEY:-}
      HOST: 0.0.0.0
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
  ollama:
    image: ollama/ollama:0.11.11
    profiles: [local-ai]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - graph-models:/root/.ollama

volumes:
  graph-data:
  graph-models:
