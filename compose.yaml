services:
  falkordb:
    image: falkordb/falkordb:v4.18.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - graph-data:/data
    environment:
      REDIS_ARGS: "--appendonly yes"
      FALKORDB_DATA_PATH: /data
      BROWSER: "0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      GRAPH_NAME: graph
      HOST: 0.0.0.0
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  graph-data:
