name: Verify
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["ci/**"]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.18.3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-packages.mjs
      - run: GRAPH_INTEGRATION=1 pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: docker compose exec -T app node --import tsx scripts/seed.ts
      - run: docker compose exec -T app node --import tsx scripts/launch-demo.ts
      - run: docker compose exec -T app node --import tsx scripts/native-demo.ts prepare ci-native-branch
      - run: docker compose exec -T app node --import tsx scripts/native-demo.ts prepare ci-overlay-branch overlay
      - run: docker compose exec -T app node --import tsx scripts/job-demo.ts prepare
      - run: docker compose stop app falkordb
      - run: docker compose up -d --wait
      - run: docker compose exec -T app node --import tsx scripts/native-demo.ts verify ci-native-branch
      - run: docker compose exec -T app node --import tsx scripts/native-demo.ts verify ci-overlay-branch overlay
      - run: docker compose exec -T app node --import tsx scripts/job-demo.ts verify
      - run: node -e "fetch('http://127.0.0.1:3001/api/ontologies/semiconductor/graph').then(r=>r.json()).then(g=>{if(g.objects.length!==14||g.relationships.length!==17)process.exit(1)})"
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
